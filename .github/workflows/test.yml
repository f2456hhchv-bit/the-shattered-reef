name: The Shattered Reef checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every module
        run: |
          find src -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: node --test "tests/**/*.test.mjs"
